name: android

# Godot Android pipeline.
# Contrast with the Unity repo (gta-ai/.github/workflows/android-apk.yml):
# NO license secrets are needed here — no UNITY_LICENSE / UNITY_EMAIL /
# UNITY_PASSWORD. Godot and its export templates are free; CI signing uses an
# auto-generated debug keystore (optional release secrets can be added later
# without changing this flow).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3.0

jobs:
  tests:
    name: Godot headless tests (gate for build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import project (best-effort script class cache)
        run: godot --headless --import || echo "import skipped (no project.godot yet)"
      - name: Run headless test runner (fails on assert)
        run: godot --headless --script tests/test_runner.gd

  build-android:
    name: Export Android APK/AAB with Godot
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: android-actions/setup-android@v3 is intentionally NOT used here —
      # it installs the obsolete `tools` package (removed by Google) and fails
      # on modern cmdline-tools with "Failed to find package 'tools'"
      # (sdkmanager exit 1). GH runners already ship cmdline-tools; we only
      # install packages that still exist.
      - name: Setup Android SDK (manual cmdline-tools)
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDK="$ANDROID_SDK_ROOT"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "cmdline-tools missing — downloading..."
            sudo mkdir -p "$SDK/cmdline-tools"
            cd /tmp
            curl -fL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            sudo unzip -o -q cmdtools.zip -d "$SDK/cmdline-tools"
            sudo mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Cache Godot export templates (~1GB)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-4.3.0
          restore-keys: |
            godot-templates-

      - name: Install export templates
        run: |
          set -euo pipefail
          TPL_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          if [ ! -f "$TPL_DIR/android_release.apk" ]; then
            curl -fL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
            mkdir -p "$TPL_DIR"
            unzip -o /tmp/templates.tpz -d "$TPL_DIR"
            # tpz sometimes nests files one level deep — flatten if so.
            if [ ! -f "$TPL_DIR/android_release.apk" ]; then
              nested="$(find "$TPL_DIR" -name 'android_release.apk' -print -quit)"
              if [ -n "$nested" ]; then
                mv "$(dirname "$nested")"/* "$TPL_DIR"/
              fi
            fi
          fi
          ls "$TPL_DIR" | head -30
          test -f "$TPL_DIR/android_release.apk" || { echo "::error::android_release.apk missing after install"; exit 1; }
          test -f "$TPL_DIR/android_debug.apk" || { echo "::error::android_debug.apk missing after install"; exit 1; }

      - name: Auto-generate debug keystore (no license secrets needed)
        # Unlike Unity (UNITY_LICENSE), Godot signs debug exports with a plain
        # debug keystore — generated here when missing.
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Export release APK
        # Requires the "Android" preset in export_presets.cfg (owned by the
        # export/preset agent). Debug keystore signs it; no Unity license.
        # pipefail: without it `| tee` swallows godot's exit code and a
        # failed export would still mark the step green.
        run: |
          set -o pipefail
          mkdir -p builds
          godot --headless --export-release "Android" builds/game.apk 2>&1 | tee export.log

      - name: Export release AAB (when preset exists)
        run: |
          set -o pipefail
          if grep -q '"Android AAB"' export_presets.cfg 2>/dev/null; then
            godot --headless --export-release "Android AAB" builds/game.aab 2>&1 | tee -a export.log
          else
            echo "Skipping AAB: no 'Android AAB' preset in export_presets.cfg" | tee -a export.log
          fi

      - name: List build output
        if: always()
        run: ls -lh builds/ || echo "no builds/ output"

      - name: Upload APK+AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: game-android-${{ github.sha }}
          path: |
            builds/*.apk
            builds/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload export log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-export-log-${{ github.sha }}
          path: export.log
          if-no-files-found: ignore
          retention-days: 7
