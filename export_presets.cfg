[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../builds/game.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
; CPU: arm64-v8a only (mid-range 60fps target; drop v7a/x86_64 to slim the APK).
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.gtaai.vicecity"
package/name="GTA Vice Prototype"
package/signed=false
; 0 = Landscape (matches display/window/handheld/orientation in project.godot).
screen/orientation=0
screen/custom_layout=""
; Graphics API follows the project renderer: gl_compatibility -> GLES3.
graphics/opengl_debug=false
xr_features/xr_mode=0
; Optional permissions (kept minimal; INTERNET off unless telemetry needs it).
permissions/internet=true
permissions/vibrate=true
; Debug keystore placeholder: on first local export the editor auto-creates a
; debug key at ~/.android/debug.keystore (user "android"). For CI, supply real
; credentials via env vars / .export_credentials (gitignored), never commit.
keystore/debug="res://debug.keystore"
keystore/debug_user="android"
keystore/debug_password="android"
keystore/release=""
keystore/release_user=""
keystore/release_password=""
apk_expansion/enable=false

